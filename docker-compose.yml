version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: pos_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: pos_transaction
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: adminpanel-backend
    container_name: adminpanel-backend
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=pos_transaction
      - DB_USER=root
      - DB_PASS=root
      - JWT_SECRET=b0f81d3d6e5a49c288f34177b94d1b71
      - JWT_EXPIRES_IN=24h
      - CRYPTO_SECRET=c3a8f9031b2e4d56789a0bcdef123456
      - APP_NAME=pos-transaction
      - APP_VER=1.0.0
      - BCRYPT_ROUNDS=8
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: adminpanel-frontend
    container_name: adminpanel-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:3000
      - VITE_APP_NAME=pos-transaction
      - VITE_APP_VER=1.0.0
      - VITE_CRYPTO_SECRET=c3a8f9031b2e4d56789a0bcdef123456

volumes:
  mysql_data:
